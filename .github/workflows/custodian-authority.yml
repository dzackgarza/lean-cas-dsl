name: Custodian authority assessment
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full candidate commit in the independently assigned component repository
        required: true
        type: string
permissions:
  contents: write # trusted accepted/controller job writes only the existing signed review log
jobs:
  independent-review:
    if: github.ref == 'refs/heads/accepted/controller'
    runs-on: ubuntu-latest
    environment: custodian-review
    steps:
      - name: Check out the protected controller deployment
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: deployment
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install the pinned independent reviewer
        run: bun add --global @anthropic-ai/claude-code@2.1.285
      - name: Materialize configured revisions as data
        run: python3 deployment/custodian/materialize.py --configuration deployment/custodian/deployment.json --candidate "$CANDIDATE"
        env:
          CANDIDATE: ${{ inputs.candidate }}
      - name: Assess one complete immutable tuple
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REVIEW_KEY: ${{ secrets.CUSTODIAN_REVIEW_KEY }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          key="$RUNNER_TEMP/reviewer-key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$REVIEW_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          unset REVIEW_KEY
          python3 deployment/custodian/authority_review.py --configuration deployment/custodian/deployment.json --candidate "$CANDIDATE" --signing-key "$key" --out out
      - name: Retain the judgment in the existing review discussion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python3 deployment/custodian/record_review.py --configuration deployment/custodian/deployment.json --out out
      - name: Preserve the signed assessment and immutable request
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custodian-independent-assessment
          path: out
          if-no-files-found: error
