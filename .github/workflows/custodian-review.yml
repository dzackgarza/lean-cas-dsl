# Trusted-base independent review. Candidate source is data. The reviewer environment
# is deployed only from accepted/controller; construction main is not an accepted release.
name: Custodian review
on:
  pull_request_target:
    branches: [main, "accepted/controller"]
    types: [opened, synchronize, reopened, edited]
    # A descriptive edit outside the boundary is not reviewed (CONTRIBUTING, "Documentation and
    # construction work"); the owner's texts and custodian/ are.
    paths:
      - "**"
      - "!**/*.md"
      - "specs/owner/**"
      - "custodian/**"
permissions:
  contents: write # the rejection log branch only
  pull-requests: write # the verdict comment
concurrency:
  group: custodian-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  review:
    name: Custodian review
    runs-on: ubuntu-latest
    environment: custodian-review
    steps:
      - name: Check out main (the trusted code)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: base
          persist-credentials: false
      - name: Check out the pull request's head (data only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - name: Check out each side's chain at its manifest revisions, and the rejection log
        run: |
          python3 base/scripts/ci_chain.py base
          python3 base/scripts/ci_chain.py head
          if git clone --quiet --branch custodian/rejections \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" rejections; then :
          else
            git init --quiet rejections && git -C rejections checkout --quiet --orphan custodian/rejections
            git -C rejections remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install Claude Code (the reviewer)
        run: bun add --global @anthropic-ai/claude-code@2.1.285
      - name: The author's explanation and any reconsideration request (untrusted data)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('fs');
            // The description as it is now: a re-run replays the original event, whose payload
            // carries the description at that moment, not the author's later correction.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.pull_request.number});
            fs.writeFileSync('explanation.md', pr.body || '');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number});
            const asks = comments.filter(c => (c.body || '').startsWith('Custodian reconsideration:'));
            fs.writeFileSync('reconsideration.md', asks.length ? asks[asks.length - 1].body : '');
      - name: Verify exact signed input advancement
        if: github.base_ref == 'accepted/controller'
        env:
          CANDIDATE: ${{ github.event.pull_request.head.sha }}
        run: |
          ln -s base deployment
          assessed=$(python3 -c 'import json; c=json.load(open("base/custodian/deployment.json")); n=json.load(open("head/custodian/deployment.json")); print(n["accepted"][c["review_component"]]["commit"])')
          python3 base/custodian/materialize.py --configuration base/custodian/deployment.json --candidate "$assessed"
          python3 base/custodian/verify_publication.py --configuration base/custodian/deployment.json --candidate-tree head
      - name: Review
        id: review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CUSTODIAN_REVIEW_KEY: ${{ secrets.CUSTODIAN_REVIEW_KEY }}
        run: |
          key="$RUNNER_TEMP/review_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$CUSTODIAN_REVIEW_KEY" > "$key"
          python3 base/custodian/review/review.py --base base --head head \
            --trusted-fpr "SHA256:IO3YM5setrWvSESXaXEr+7CB1YR8BOjKTP2SzTLFZbI" --signing-key "$key" \
            --out out --rejections rejections \
            --pr ${{ github.event.pull_request.number }} --head-sha ${{ github.event.pull_request.head.sha }} \
            --explanation explanation.md --reconsideration reconsideration.md
      - name: Append to the rejection log
        if: always()
        run: |
          cd rejections
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git -c user.name=custodian-review -c user.email=custodian-review@users.noreply.github.com \
              commit --quiet -m "Rejection: PR #${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}"
            git push --quiet origin HEAD:custodian/rejections
          fi
      - name: Upload the verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custodian-verdict
          path: out/verdicts
          if-no-files-found: ignore
      - name: Post the outcome
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('out/comment.md')) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: fs.readFileSync('out/comment.md', 'utf8') + '\n---\n_Custodian review (pull_request_target on main). A finding you can show to be wrong: comment `Custodian reconsideration:` with the evidence, then re-run this job._\n'});
