name: Controller source checks
on:
  push:
    branches: [main]
  pull_request:
    paths: ['custodian/**', '.github/workflows/custodian-*.yml']
permissions: {}
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run source, hostile authority and full review transition fixtures
        run: |
          python3 custodian/test_controller.py
          python3 custodian/test_launcher.py
          python3 custodian/test_launch_author.py
          python3 custodian/test_materialize.py
          python3 custodian/test_assessment.py
          python3 custodian/prepare_runtime.py --python "$(command -v python3)"
          python3 custodian/test_execution.py
          python3 custodian/review/test_context.py
          python3 custodian/review/prepare_fixture.py --source "$PWD" --scratch "$RUNNER_TEMP/controller-fixture"
