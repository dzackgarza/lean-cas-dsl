name: Gates
on:
  # A documentation-only change runs no Lean job (CONTRIBUTING, "Documentation and construction work").
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gates:
    name: Authorship, kernel totality, no leaves, permanent acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Check out the chain at its pins
        run: python3 scripts/ci_chain.py
      - name: Authors are separated by layer
        run: python3 scripts/check_authorship.py --self-test && python3 scripts/check_authorship.py
      - name: No leaves in lean-cas-dsl
        run: python3 scripts/check_no_leaves.py --self-test && python3 scripts/check_no_leaves.py
      - name: Permanent acceptance assertions
        run: python3 scripts/check_acceptance_permanent.py
  kernel-purity:
    name: The kernel carries no mathematics (CasGates, a Lean build)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          build-args: CasGates
          test: false
          lint: false
  build:
    name: Build and audit (just test)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Check out the chain at the manifest revisions
        run: python3 scripts/ci_chain.py
      - name: Clone QC infrastructure
        run: git clone --depth 1 https://github.com/dzackgarza/ai-review-ci.git "$HOME/ai-review-ci"
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Install Lean and restore the Mathlib cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - name: Build and audit
        run: just test
  acceptance:
    name: Acceptance, per assertion against the base
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out the head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: head
      - name: Check out the base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Check out each side's chain at its manifest revisions
        run: |
          python3 head/scripts/ci_chain.py head
          python3 head/scripts/ci_chain.py base
      - name: Install Lean
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: head
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
      - name: Run the suite at the base and at the head
        run: |
          for side in base head; do
            # The harness exits nonzero when an assertion fails; the report decides, and a run
            # that did not complete writes none, which fails the comparison.
            rm -f "$GITHUB_WORKSPACE/$side.json"
            (cd "$side" && lake exe cache get && lake build cas-harness \
              && { lake exe cas-harness --report "$GITHUB_WORKSPACE/$side.json" || true; })
          done
      - name: Compare, assertion by assertion
        run: python3 head/scripts/check_acceptance_regression.py base.json head.json
      - name: Admitted assertions keep their semantic questions (gov-meaning-permanence)
        run: python3 head/scripts/check_question_permanence.py --base base/CasAcceptance/Permanent/questions.json head.json
