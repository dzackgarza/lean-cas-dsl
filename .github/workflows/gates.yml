name: Gates
'on':
  push:
    branches:
      - main
      - b0/**
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  gates:
    name: Boundary integrity and permanent acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Check out the chain at latest main
        run: python3 scripts/ci_chain.py
      - name: No leaves in lean-cas-dsl
        run: python3 scripts/check_no_leaves.py --self-test && python3 scripts/check_no_leaves.py
      - name: Permanent acceptance assertions
        run: python3 scripts/check_acceptance_permanent.py
  kernel-purity:
    name: The kernel carries no mathematics (CasGates, a Lean build)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          test: false
          lint: false
          build: false
          auto-config: 'false'
      - name: Build the gate at latest main
        run: |
          python3 scripts/ci_chain.py
          lake update lean_categories cas_leaf_contracts nbdsl-worker
          lake build CasGates
  build:
    name: Build and audit (just test)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Check out the chain at latest main
        run: python3 scripts/ci_chain.py
      - name: Clone QC infrastructure
        run: git clone --depth 1 https://github.com/dzackgarza/ai-review-ci.git "$HOME/ai-review-ci"
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Install Lean and restore the Mathlib cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - name: Install native computation engines
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39
        with:
          environment-name: cas-engines
          create-args: -c conda-forge sage
          init-shell: none
          cache-environment: true
      - name: Expose and check native engine interpreter
        shell: micromamba-shell {0}
        run: |
          python - <<'PYENGINE'
          import os
          import sys
          import sage.all
          from sage.libs.gap.libgap import libgap
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write(f"CAS_SAGE_PYTHON={sys.executable}\n")
              stream.write(f"CAS_GAP_PYTHON={sys.executable}\n")
          print(f"Native Sage and GAP imports available in {sys.executable}")
          PYENGINE
      - name: Build and audit
        run: just test
  acceptance:
    name: Acceptance, per assertion against the base
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out the head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: head
      - name: Check out the base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Check out each side's chain at latest main
        run: |
          python3 head/scripts/ci_chain.py head
          python3 head/scripts/ci_chain.py base
      - name: Install Lean
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: head
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Check candidate assertions against the accepted base ledger
        run: python3 head/scripts/check_acceptance_permanent.py --base base/CasAcceptance/Permanent/admitted.json
      - name: Install native computation engines
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39
        with:
          environment-name: cas-engines
          create-args: -c conda-forge sage
          init-shell: none
          cache-environment: true
      - name: Expose and check native engine interpreter
        shell: micromamba-shell {0}
        run: |
          python - <<'PYENGINE'
          import os
          import sys
          import sage.all
          from sage.libs.gap.libgap import libgap
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write(f"CAS_SAGE_PYTHON={sys.executable}\n")
              stream.write(f"CAS_GAP_PYTHON={sys.executable}\n")
          print(f"Native Sage and GAP imports available in {sys.executable}")
          PYENGINE
      - name: Run the suite at the base and at the head
        run: |
          for side in base head; do
            inventory_args=()
            if [ "$side" = head ]; then
              inventory_args=(--inventory "$GITHUB_WORKSPACE/base/CasAcceptance/Permanent/admitted.json")
            fi
            # The harness exits nonzero when an assertion fails; the report decides, and a run
            # that did not complete writes none, which fails the comparison.
            rm -f "$GITHUB_WORKSPACE/$side.json"
            (cd "$side" && python3 scripts/ci_chain.py \
              && lake update lean_categories cas_leaf_contracts nbdsl-worker \
              && lake exe cache get && lake build cas-harness \
              && { lake exe cas-harness "${inventory_args[@]}" --report "$GITHUB_WORKSPACE/$side.json" || true; })
          done
      - name: Publish the head report as the burndown queue
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: acceptance-report
          path: |
            head.json
            base.json
          if-no-files-found: error
      - name: Compare, assertion by assertion
        run: python3 head/scripts/check_acceptance_regression.py base.json head.json
      - name: Admitted assertions keep their semantic questions (gov-meaning-permanence)
        run: python3 head/scripts/check_question_permanence.py --base base/CasAcceptance/Permanent/questions.json head.json
  controller-boundary:
    name: Controller boundary fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare the credential-free Python runtime
        run: python3 custodian/prepare_runtime.py --python /usr/bin/python3
      - name: Run controller and container boundary fixtures
        run: python3 -m unittest discover -s custodian -p 'test_*.py'
      - name: Run reviewer transport and context fixtures
        run: python3 -m unittest discover -s custodian/review -p 'test_*.py'
