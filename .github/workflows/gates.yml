name: Gates
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gates:
    name: Authorship, kernel totality, no leaves, permanent acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Check out the chain at its pins
        run: python3 scripts/ci_chain.py
      - name: Authors are separated by layer
        run: python3 scripts/check_authorship.py --self-test && python3 scripts/check_authorship.py
      - name: The kernel never makes a term defined by catching its failure
        run: python3 scripts/check_kernel_totality.py --self-test && python3 scripts/check_kernel_totality.py
      - name: No leaves in lean-cas-dsl
        run: python3 scripts/check_no_leaves.py --self-test && python3 scripts/check_no_leaves.py
      - name: Permanent acceptance assertions
        run: python3 scripts/check_acceptance_permanent.py
  kernel-purity:
    name: The kernel carries no mathematics (CasGates, a Lean build)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          build-args: CasGates
          test: false
          lint: false
  build:
    name: Build and audit (just test)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Check out the chain at the manifest revisions
        run: python3 scripts/ci_chain.py
      - name: Clone QC infrastructure
        run: git clone --depth 1 https://github.com/dzackgarza/ai-review-ci.git "$HOME/ai-review-ci"
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Install Lean and restore the Mathlib cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - name: Build and audit
        run: just test
