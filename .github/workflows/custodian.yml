# Feedback only. The trust anchor is the owner's fingerprint, supplied outside the repository;
# a green run of a workflow the pushed commit can edit is not acceptance (custodian/CONTAINMENT.md).
name: Custodian seal
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check out the chain at the manifest revisions
        run: python3 scripts/ci_chain.py
      - name: Verify the custodian seal (in construction, the fixed obligations only)
        run: |
          phase=$(python3 -c "import json,pathlib;p=pathlib.Path('custodian/phase.json');print(json.loads(p.read_text())['phase'] if p.is_file() else 'steady')")
          python3 custodian/verify.py --trusted-fpr SHA256:IO3YM5setrWvSESXaXEr+7CB1YR8BOjKTP2SzTLFZbI \
            $([ "$phase" = construction ] && echo --construction)
