# Feedback only. The trust anchor is the owner's fingerprint, supplied outside the repository;
# a green run of a workflow the pushed commit can edit is not acceptance (custodian/CONTAINMENT.md).
name: Custodian seal
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the chain at the manifest revisions
        run: python3 scripts/ci_chain.py
      - name: Verify the custodian seal
        run: |
          python3 custodian/verify.py --trusted-fpr SHA256:IO3YM5setrWvSESXaXEr+7CB1YR8BOjKTP2SzTLFZbI
