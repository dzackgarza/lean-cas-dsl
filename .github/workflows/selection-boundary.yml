name: Native categorical selection boundary

on:
  push:
    branches:
      - fix/categorical-selection-boundary-20261107
      - integration/kernel-v1-20261106
    paths:
      - 'CasCompiler/**'
      - 'CasCompiler.lean'
      - 'CasGates/**'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/selection-boundary.yml'
  pull_request:
    paths:
      - 'CasCompiler/**'
      - 'CasCompiler.lean'
      - 'CasGates/**'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/selection-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selected-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record the exact source and dependency tuple
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/selection-source-sha.txt"
          cp lake-manifest.json "$RUNNER_TEMP/selection-manifest.json"
          cp lean-toolchain "$RUNNER_TEMP/selection-toolchain.txt"
      - name: Install locked Lean toolchain and restore Mathlib
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Exercise native selection and source-preservation controls
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            +CasCompiler.SelectionBoundaryTests
            +CasCompiler.OperationFamilyTests
            +CasCompiler.ComparisonTests
            +CasCompiler.WhiskeringTests
            +CasCompiler.ConstructorComparisonTests
            +CasCompiler.FunctorExpressionTests
            +CasCompiler.OperationRefinementTests
            +CasCompiler.EqualityEvidenceTests
            +CasCompiler.NativeRouteTests
            +CasCompiler.ResolveTests
            +CasGates.Production
          )
          printf '%s\n' "${targets[@]}" > "$RUNNER_TEMP/selection-targets.txt"
          if ! lake build "${targets[@]}" > "$RUNNER_TEMP/selection-native.log" 2>&1; then
            grep -E 'error:|failed|✖' "$RUNNER_TEMP/selection-native.log" || true
            exit 1
          fi
          tail -n 25 "$RUNNER_TEMP/selection-native.log"
          git diff --exit-code -- lake-manifest.json lean-toolchain
      - name: Check the computation-only repository boundary
        run: |
          python3 scripts/check_no_leaves.py --self-test
          python3 scripts/check_no_leaves.py
      - name: Publish exact native verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: selection-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/selection-source-sha.txt
            ${{ runner.temp }}/selection-manifest.json
            ${{ runner.temp }}/selection-toolchain.txt
            ${{ runner.temp }}/selection-targets.txt
            ${{ runner.temp }}/selection-native.log
          if-no-files-found: error
          retention-days: 14
