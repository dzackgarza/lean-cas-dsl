name: Native categorical selection boundary

on:
  push:
    branches:
      - fix/categorical-selection-boundary-20261107
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selected-data:
    if: github.ref == 'refs/heads/fix/categorical-selection-boundary-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Apply the exact pinned repair with corrected native indexing
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          import textwrap
          revision = '01c8ec04ca0acaa5bb5e83231e86e6a9f26d0ab2'
          path = '.github/workflows/selection-boundary.yml'
          text = subprocess.check_output(['git', 'show', f'{revision}:{path}'], text=True)
          marker = "          python3 - <<'PY'\n"
          start = text.index(marker) + len(marker)
          stop = text.index('\n          PY\n', start)
          script = textwrap.dedent(text[start:stop])
          for old, new in [('matrix[i]![j]!', '(matrix[i]!)[j]!'),
                           ('checked[i]![j]!', '(checked[i]!)[j]!')]:
              if script.count(old) != 1:
                  raise SystemExit(f'Unexpected pinned repair occurrence: {old}')
              script = script.replace(old, new)
          exec(compile(script, f'{revision}:{path}:guarded-native-edit', 'exec'))
          PY
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.13.7'
      - name: Install locked Lean toolchain and restore Mathlib
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Provision the frozen SDK before native controls
        run: uv sync --frozen --project .lake/packages/cas_leaf_contracts
      - name: Verify the actual source selection controls first
        shell: bash
        run: |
          set -euo pipefail
          targets=(+CasCompiler.SelectionBoundaryTests +CasCompiler.OperationFamilyTests +CasCompiler.ComparisonTests +CasCompiler.WhiskeringTests +CasCompiler.ConstructorComparisonTests +CasCompiler.FunctorExpressionTests +CasCompiler.OperationRefinementTests +CasCompiler.EqualityEvidenceTests +CasCompiler.NativeRouteTests +CasCompiler.ResolveTests)
          printf '%s\n' "${targets[@]}" > "$RUNNER_TEMP/selection-targets.txt"
          if ! lake build "${targets[@]}" > "$RUNNER_TEMP/selection-native.log" 2>&1; then
            grep -E 'error:|failed|✖' "$RUNNER_TEMP/selection-native.log" || true
            exit 1
          fi
          tail -n 25 "$RUNNER_TEMP/selection-native.log"
      - name: Verify the unchanged complete production boundary gate
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' +CasGates.Production >> "$RUNNER_TEMP/selection-targets.txt"
          if ! lake build +CasGates.Production > "$RUNNER_TEMP/selection-production.log" 2>&1; then
            grep -E 'error:|failed|✖' "$RUNNER_TEMP/selection-production.log" || true
            exit 1
          fi
          tail -n 25 "$RUNNER_TEMP/selection-production.log"
          python3 scripts/check_no_leaves.py --self-test
          python3 scripts/check_no_leaves.py
          git diff --exit-code -- lake-manifest.json lean-toolchain
      - name: Commit the validated implementation on this repair branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {'CasCompiler/Resolve.lean', 'CasCompiler/SelectionBoundaryTests.lean', 'CasRuntime/SDKTests.lean'}
          if changed != expected:
              raise SystemExit(f'Refusing unexpected changes: {changed}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CasCompiler/Resolve.lean CasCompiler/SelectionBoundaryTests.lean CasRuntime/SDKTests.lean
          git commit -m 'fix: separate explicit route use from finite supplied-agreement checking' -m 'Explicit routes retain their exact source derivations and remain mandatory where requested. Finite implicit agreement retains all original bindings, validates supplied proof slots before generic discharge, and reports source ambiguity without arbitrary theorem search. Nondefinitional evidence retains its actual formal context. Native controls cover missing data, malformed evidence, chosen cell actions and distinct choices; the complete production boundary gate also passes. SDK provisioning resolves uv through PATH, not an owner-machine path. Mathematical sources, protected questions and budgets are unchanged. Refs #66, #87, #89.'
          git push origin HEAD:refs/heads/fix/categorical-selection-boundary-20261107
      - name: Record exact tested code and any uncommitted diff
        if: always()
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/selection-source-sha.txt"
          git diff > "$RUNNER_TEMP/selection-uncommitted.patch"
          cp lake-manifest.json "$RUNNER_TEMP/selection-manifest.json"
          cp lean-toolchain "$RUNNER_TEMP/selection-toolchain.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: selection-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/selection-source-sha.txt
            ${{ runner.temp }}/selection-manifest.json
            ${{ runner.temp }}/selection-toolchain.txt
            ${{ runner.temp }}/selection-targets.txt
            ${{ runner.temp }}/selection-native.log
            ${{ runner.temp }}/selection-production.log
            ${{ runner.temp }}/selection-uncommitted.patch
          if-no-files-found: error
          retention-days: 14
