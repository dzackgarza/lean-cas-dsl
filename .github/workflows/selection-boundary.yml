name: Native categorical selection boundary

on:
  push:
    branches:
      - fix/categorical-selection-boundary-20261107
  pull_request:
    paths:
      - 'CasCompiler/**'
      - 'CasCompiler.lean'
      - 'CasContract/**'
      - 'lake-manifest.json'
      - '.github/workflows/selection-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selected-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Retain exact tested source
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/selection-source-sha.txt"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/selection-source.tar.gz"
      - name: Publish tested source provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: selection-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/selection-source-sha.txt
            ${{ runner.temp }}/selection-source.tar.gz
          retention-days: 3
      - name: Install locked Lean toolchain and restore Mathlib
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Check actual native selection and component boundaries
        shell: bash
        run: |
          set -o pipefail
          lake build +CasCompiler.SelectionBoundaryTests +CasCompiler.OperationFamilyTests +CasCompiler.ComparisonTests 2>&1 | tee "$RUNNER_TEMP/selection-native.log"
      - name: Package public locked native test inputs
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tar -I 'zstd -T2 -3' -cf "$RUNNER_TEMP/selection-lake.tar.zst" .lake
          tar -I 'zstd -T2 -3' -C "$HOME/.elan/toolchains" -cf "$RUNNER_TEMP/selection-toolchain.tar.zst" leanprover--lean4---v4.33.0
          sha256sum "$RUNNER_TEMP/selection-lake.tar.zst" "$RUNNER_TEMP/selection-toolchain.tar.zst" > "$RUNNER_TEMP/selection-input-sha256.txt"
      - name: Transfer locked inputs for own-container tests
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: selection-locked-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/selection-lake.tar.zst
            ${{ runner.temp }}/selection-toolchain.tar.zst
            ${{ runner.temp }}/selection-input-sha256.txt
            ${{ runner.temp }}/selection-source-sha.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Publish native build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: selection-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/selection-source-sha.txt
            ${{ runner.temp }}/selection-native.log
          if-no-files-found: error
          retention-days: 7
